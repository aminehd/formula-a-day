<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>postcards</title>
<style>
  :root { color-scheme: dark; }
  body { background: #0b0b10; color: #e9e6f0; margin: 0;
         font: 16px/1.6 ui-monospace, "DejaVu Sans Mono", monospace;
         padding: 3rem 1.25rem 6rem; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 .4rem; }
  p { color: #808496; margin: 0 0 2.5rem; }
  figure { margin: 0 0 3rem; }
  img { width: 100%; height: auto; display: block; border-radius: 6px;
        background: #fff; }
  figcaption { display: flex; justify-content: space-between; gap: 1rem;
               margin-top: .6rem; color: #808496; font-size: .85rem; }
  a { color: #e9e6f0; }
</style>
<main>
  <h1>postcards</h1>
  <p>Each one carries the formula, the code and the clip, so it works
     with no caption. Save the file and upload it directly &mdash; chat
     apps inline a GIF but not a link.</p>

  <figure><img loading="lazy" src="sigmoid.gif" alt="sigmoid">
    <figcaption><span>the squash</span>
    <a download href="sigmoid.gif">sigmoid.gif</a></figcaption></figure>

  <figure><img loading="lazy" src="tanh.gif" alt="tanh">
    <figcaption><span>the same squash, centred</span>
    <a download href="tanh.gif">tanh.gif</a></figcaption></figure>

  <figure><img loading="lazy" src="gelu.gif" alt="gelu">
    <figcaption><span>a gate multiplied back onto x</span>
    <a download href="gelu.gif">gelu.gif</a></figcaption></figure>

  <figure><img loading="lazy" src="cloud.gif" alt="tanh on a sheet of points">
    <figcaption><span>60,000 points, pressed into a square</span>
    <a download href="cloud.gif">cloud.gif</a></figcaption></figure>

  <figure><img loading="lazy" src="provenance.gif" alt="grains">
    <figcaption><span>colour means which input, not value</span>
    <a download href="provenance.gif">provenance.gif</a></figcaption></figure>
</main>
